[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-x"
version = "0.1.0"
description = "Polarimetric stress imaging: analytical and finite-element forward models and constrained inversion"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pandas>=2.2,<4", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
polaris = "polaris.cli:main"

[tool.setuptools.packages.find]
include = ["polaris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
